<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1740 498" width="1740" height="498">
  <!-- ============ left: coordination octahedron + orbit ============ -->
  <g transform="translate(60,20)">
    <!-- full orbit ellipse, drawn first so the polyhedron occludes it and the two interlock -->
    <ellipse cx="200" cy="229" rx="226" ry="98" fill="none" stroke="#14A6A8"
             stroke-width="11" transform="rotate(-28 200 229)"/>

    <!-- octahedron: top T(200,32) bottom B(200,426) left L(24,229) right R(376,229) front F(150,282) back K(250,176) -->
    <path d="M200,32 L24,229 L150,282 Z"   fill="#153E60"/>
    <path d="M200,426 L24,229 L150,282 Z"  fill="#0E2C46"/>
    <path d="M200,32 L376,229 L250,176 Z"  fill="#153E60"/>
    <path d="M200,426 L376,229 L250,176 Z" fill="#0E2C46"/>
    <path d="M200,32 L150,282 L200,426 L250,176 Z" fill="#14A6A8"/>

    <!-- edges -->
    <g stroke="#FFFFFF" stroke-width="7" fill="none" stroke-linejoin="round">
      <path d="M200,32 L24,229 L200,426 L376,229 Z"/>
      <path d="M200,32 L150,282 L200,426"/>
      <path d="M200,32 L250,176 L200,426"/>
      <path d="M24,229 L150,282 L376,229 L250,176 Z"/>
    </g>

    <!-- coordinating vertex spheres -->
    <circle cx="200" cy="32"  r="34" fill="#123A5A" stroke="#FFFFFF" stroke-width="7"/>
    <circle cx="200" cy="426" r="34" fill="#123A5A" stroke="#FFFFFF" stroke-width="7"/>
    <circle cx="24"  cy="229" r="34" fill="#123A5A" stroke="#FFFFFF" stroke-width="7"/>
    <circle cx="376" cy="229" r="34" fill="#123A5A" stroke="#FFFFFF" stroke-width="7"/>
    <!-- central cation: teal ring -->
    <circle cx="200" cy="229" r="21" fill="#FFFFFF" stroke="#14A6A8" stroke-width="11"/>
    <!-- orange sphere on the orbit, drawn last so the orbit reads as passing in front -->
    <circle cx="408" cy="84" r="30" fill="#F0A020"/>
  </g>

  <!-- ============ right: PRIS wordmark + expansion ============ -->
  <text x="600" y="298"
        font-family="Avenir Next, Avenir, Helvetica Neue, Helvetica, Arial, sans-serif"
        font-size="250" font-weight="600" letter-spacing="6" fill="#123A5A">PRIS</text>
  <text x="606" y="386"
        font-family="Avenir Next, Avenir, Helvetica Neue, Helvetica, Arial, sans-serif"
        font-size="52" font-weight="500" fill="#14A6A8">Plausibility Rules for Inorganic Structures</text>
</svg>
